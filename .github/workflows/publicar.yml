name: Publicar

# Publica la app en GitHub Pages en cada push a main.
#
# La app es estática: esto compila y sube dist/, no hay nada más que desplegar.
#
# La ruta de publicación sale del NOMBRE del repo, y no de un valor escrito a
# mano, porque es la parte que se olvida: si el build sale con la ruta de la raíz
# y el repo es un proyecto de Pages, el HTML pide los archivos en /assets/... en
# vez de /<repo>/assets/... y la página queda en blanco sin dar ningún error.
#
# Un repo de usuario (el que se llama "usuario.github.io") se sirve en la raíz
# del dominio, así que su ruta es "/" y no "/usuario.github.io/". Por eso el
# cálculo tiene esa condición y no es simplemente el nombre del repo.

on:
  push:
    branches: [main]
  # Se puede disparar a mano desde la pestaña Actions, útil para republicar sin
  # tocar nada.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez. Sin esto, dos pushes seguidos pueden terminar
# publicando el build más viejo al final.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular la ruta de publicación
        id: ruta
        run: |
          REPO="${{ github.event.repository.name }}"
          # Si al repo se le saca el sufijo ".github.io" y queda otro nombre
          # distinto, es que ese sufijo estaba: es un repo de usuario, que se
          # sirve en la raíz del dominio. Si queda igual, es un repo de
          # proyecto, que se sirve en /<nombre>/.
          if [ "${REPO%.github.io}" != "$REPO" ]; then
            echo "valor=/" >> "$GITHUB_OUTPUT"
          else
            echo "valor=/$REPO/" >> "$GITHUB_OUTPUT"
          fi
          echo "Publicando en: $REPO -> $(cut -d= -f2 "$GITHUB_OUTPUT" | tail -1)"

      - name: Verificar
        # Los seis verificadores, antes de compilar.
        #
        # `npm run build` sólo detecta errores de sintaxis y de imports rotos: es
        # lo mínimo. Los verificadores miran lo que el build no ve, y cada uno
        # nació de un bug que llegó a la página publicada:
        #
        #   sintaxis     que todos los archivos estén bien escritos
        #   caracteres   letras de otro idioma coladas en el código, que aparecen
        #                cuando un archivo se guarda con la codificación
        #                equivocada y quedan ahí sin que nadie las vea
        #   imports      una llamada a una función propia sin su import: es un
        #                ReferenceError en runtime, no un error de compilación
        #   plantillas   un acento grave dentro de un comentario que vive en una
        #                plantilla: cierra el template literal y el archivo sigue
        #                siendo JavaScript válido
        #   escapado     una interpolación sin escapar dentro de un atributo de
        #                HTML, que sale cruda
        #   propiedades  un campo que se lee pero que la clase nunca escribió, o
        #                un método que pisa una propiedad con el mismo nombre y
        #                deja de existir
        #
        # Con esto, un push que rompe cualquiera de los seis no se publica.
        run: npm run verificar

      - name: Compilar
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.ruta.outputs.valor }}

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Sin esto el paso falla en un repo donde Pages todavía no está
          # activado, que es el estado en que queda un repo recién creado: hay
          # que ir a Settings → Pages a tocar una perilla a mano. Con esto, el
          # primer push deja la publicación andando sola.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
