<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Control de inventario local-first para comerciantes">
  <meta name="theme-color" content="#bbf7d0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DepoApp">
  <!--
    El ícono de la pestaña. Las dos líneas hacen falta, y el orden también: los
    navegadores se quedan con el último <link rel="icon"> que pueden mostrar, así
    que el .ico va primero como respaldo y el SVG después, que es el que se ve
    nítido a cualquier tamaño. Al revés, el ICO de 72x72 tapaba al SVG y la
    pestaña se veía borroso.

    Con cualquiera de los dos declarados el navegador deja de pedir
    /favicon.ico por su cuenta, que era el 404 de cada carga.

    Las rutas van relativas a propósito, como la de apple-touch-icon de abajo:
    así apuntan a donde la app está publicada, sea en la raíz o en un
    subdirectorio, sin depender de la configuración de Vite.
  -->
  <link rel="icon" href="favicon.ico" sizes="72x72">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <!--
    El manifiesto lo inyecta vite-plugin-pwa a partir de la ruta de publicación.
    Acá no se declara ninguno a mano: un link más apuntaría a un archivo que ya
    no existe, y mientras existió hubo dos manifiestos servidos en la misma
    página, con start_url y accesos directos distintos.
  -->
  <title>DepoApp</title>
</head>
<!--
    El body no lleva clases: el fondo, la altura y el color los pone base.css,
    que entra al final de la migración. Con las clases de Tailwind que tenía
    antes, el fondo verde se quedaba pegado aunque el resto del color pasara a
    variables, y base.css ya no lo tapaba porque body no tiene prioridad por
    encima de una clase.
  -->
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
