<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    El tema, antes del primer pintado para que no parpadee: manda lo guardado
    en "depoapp-tema" y, si nadie eligió todavía, la preferencia del sistema.
    Mientras no haya elección guardada se sigue al sistema en vivo; en cuanto
    alguien toca el botón del menú de usuario, la elección queda guardada y
    deja de mirarse la preferencia. Los tokens que leen el atributo están en
    src/css/tokens.css, y el botón que lo cambia, en src/App.js.
  -->
  <script>
    (function () {
      var poner = function (tema) { document.documentElement.dataset.tema = tema; };
      var guardado = null;
      try { guardado = localStorage.getItem('depoapp-tema'); } catch (e) { /* sin storage */ }
      var sistema = window.matchMedia('(prefers-color-scheme: dark)');
      if (guardado === 'claro' || guardado === 'oscuro') {
        poner(guardado);
      } else {
        poner(sistema.matches ? 'oscuro' : 'claro');
        if (sistema.addEventListener) {
          sistema.addEventListener('change', function (e) { poner(e.matches ? 'oscuro' : 'claro'); });
        }
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Control de inventario local-first para comerciantes">
  <meta name="theme-color" content="#bbf7d0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DepoApp">
  <!--
    El ícono de la pestaña. Las dos líneas hacen falta, y el orden también: los
    navegadores se quedan con el último <link rel="icon"> que pueden mostrar, así
    que el .ico va primero como respaldo y el SVG después, que es el que se ve
    nítido a cualquier tamaño. Al revés, el ICO de 72x72 tapaba al SVG y la
    pestaña se veía borroso.

    Con cualquiera de los dos declarados el navegador deja de pedir
    /favicon.ico por su cuenta, que era el 404 de cada carga.

    Las rutas van relativas a propósito, como la de apple-touch-icon de abajo:
    así apuntan a donde la app está publicada, sea en la raíz o en un
    subdirectorio, sin depender de la configuración de Vite.
  -->
  <link rel="icon" href="favicon.ico" sizes="72x72">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <!--
    El de Apple va en 180x180, que es el tamaño que pide iOS para la pantalla
    de inicio. El de 192 servía (lo escala), pero 180 es el que le corresponde
    y el que usa la documentación: con el exacto no hay reescalado y la marca
    sale nítida. La ruta sigue relativa por la misma razón que las de arriba.
  -->
  <link rel="apple-touch-icon" href="icons/icon-180x180.png" sizes="180x180">
  <!--
    El manifiesto lo inyecta vite-plugin-pwa a partir de la ruta de publicación.
    Acá no se declara ninguno a mano: un link más apuntaría a un archivo que ya
    no existe, y mientras existió hubo dos manifiestos servidos en la misma
    página, con start_url y accesos directos distintos.
  -->
  <title>DepoApp</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
